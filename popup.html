<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
      <link rel="stylesheet" href="trip_popup.css" />
   </head>
   <body>
      <div id="tc_popup_overlay" class="tc_popup_overlay" style="display: none">
         <div class="tc_popup_box">
            <div class="tc_popup_topbar">
               <span
                  id="tc_popup_topbar_title"
                  class="tc_popup_topbar_title"
               ></span>
               <button id="tc_popup_close" class="tc_popup_close">
                  <img
                     src="https://cdn.prod.website-files.com/6713759f858863c516dbaa19/6929904e2a85631be7392ee2_ms_cross.webp"
                     alt="cross_icon"
                  />
               </button>
            </div>
            <div class="tc_popup_cnt">
               <div class="tc_popup_icon">
                  <div class="tc_popup_icon_ring">
                     <img
                        id="tc_popup_icon_img"
                        class="tc_popup_icon_img"
                        src=""
                        alt="icon"
                     />
                  </div>
               </div>
               <h3 id="tc_popup_header" class="tc_popup_header"></h3>
               <p id="tc_popup_bold_text" class="tc_popup_bold_text"></p>
               <div id="tc_popup_paragraphs" class="tc_popup_paragraphs"></div>
               <div class="tc_popup_buttons">
                  <button
                     id="tc_popup_primary"
                     class="tc_popup_btn tc_popup_btn_primary"
                  ></button>
                  <button
                     id="tc_popup_secondary"
                     class="tc_popup_btn tc_popup_btn_secondary"
                  ></button>
               </div>
            </div>
         </div>
      </div>
   </body>
</html>
