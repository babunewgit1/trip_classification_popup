<!-- ===== Trip Classification Popup — CSS ===== -->
<style>
   .tc_popup_overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: tc_fadeIn 0.2s ease;
   }

   .tc_popup_overlay.tc_active {
      display: flex;
   }

   @keyframes tc_fadeIn {
      from {
         opacity: 0;
      }
      to {
         opacity: 1;
      }
   }

   @keyframes tc_slideUp {
      from {
         opacity: 0;
         transform: translateY(20px);
      }
      to {
         opacity: 1;
         transform: translateY(0);
      }
   }

   .tc_popup_box {
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: tc_slideUp 0.3s ease;
   }

   .tc_popup_icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: #fff0ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
   }

   .tc_popup_icon svg {
      width: 28px;
      height: 28px;
      color: #ff5d47;
   }

   .tc_popup_header {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 14px;
      line-height: 1.3;
   }

   .tc_popup_text {
      font-size: 15px;
      color: #555555;
      line-height: 1.7;
      margin: 0 0 28px;
      white-space: pre-line;
   }

   .tc_popup_buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
   }

   .tc_popup_btn {
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
   }

   .tc_popup_btn_primary {
      background: #ff5d47;
      color: #ffffff;
   }

   .tc_popup_btn_primary:hover {
      background: #e84e39;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 93, 71, 0.35);
   }

   .tc_popup_btn_secondary {
      background: transparent;
      color: #444444;
      border: 1.5px solid #e0e0e0;
   }

   .tc_popup_btn_secondary:hover {
      border-color: #ccc;
      background: #f9f9f9;
   }

   /* Mobile responsive */
   @media (max-width: 480px) {
      .tc_popup_box {
         padding: 28px 20px;
         border-radius: 12px;
      }

      .tc_popup_header {
         font-size: 19px;
      }

      .tc_popup_text {
         font-size: 14px;
      }

      .tc_popup_btn {
         padding: 12px 20px;
         font-size: 14px;
      }
   }
</style>

<!-- ===== Trip Classification Popup — HTML ===== -->
<div id="tc_popup_overlay" class="tc_popup_overlay">
   <div class="tc_popup_box">
      <div class="tc_popup_icon">
         <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
         >
            <path
               stroke-linecap="round"
               stroke-linejoin="round"
               d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
            />
         </svg>
      </div>
      <h3 id="tc_popup_header" class="tc_popup_header"></h3>
      <p id="tc_popup_text" class="tc_popup_text"></p>
      <div class="tc_popup_buttons">
         <button
            id="tc_popup_primary"
            class="tc_popup_btn tc_popup_btn_primary"
         ></button>
         <button
            id="tc_popup_secondary"
            class="tc_popup_btn tc_popup_btn_secondary"
         ></button>
      </div>
   </div>
</div>
